version: '3.8'

services:
  # MongoDB 数据库
  mongodb:
    image: mongo:latest
    container_name: lvyuan-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123

  # 后端 API 服务
  backend:
    build: ./backend
    container_name: lvyuan-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/lvyuan_agriculture?authSource=admin
      - JWT_SECRET=your-super-secret-key-change-this-in-production
      - JWT_EXPIRE=7d
      - NODE_ENV=production
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules

  # 前端（使用 Nginx 提供静态文件）
  frontend:
    image: nginx:alpine
    container_name: lvyuan-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  mongodb_data:
